<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http: file:;">
  <title>ColaMD</title>
</head>
<body>
  <div id="titlebar">
    <div id="agent-dot"></div>
    <button id="file-toggle-btn" title="显示 / 隐藏文件列表 (⌘⇧B)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
        <line x1="5.3" y1="3" x2="5.3" y2="13"/>
      </svg>
    </button>
    <button id="slides-btn" title="Open as Slides">&#9654;</button>
  </div>
  <aside id="file-panel" hidden>
    <div class="file-panel-header">文件</div>
    <ul id="file-list"></ul>
  </aside>
  <div id="editor"></div>
  <textarea id="source-editor" spellcheck="false"></textarea>
  <script type="module" src="./main.ts"></script>
</body>
</html>

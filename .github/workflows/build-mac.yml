name: Build macOS (arm64)

# Builds a macOS arm64 (Apple Silicon — Mac mini M4 etc.) installer for the
# fork. Unsigned build: no Apple code-signing credentials are required, so it
# runs on any fork. GitHub's macos-15 runner is Apple Silicon, so the output
# .dmg/.zip natively targets arm64.
#
# - push to main / manual dispatch: build + upload artifact
# - tag v*: build + create a GitHub Release with the installers attached
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Build macOS arm64 installer
        run: npx electron-builder --mac --arm64 --publish never -c.mac.notarize=false
        env:
          # No signing identity on forks — skip code signing and notarization.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: colamd-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error

  # On version tags, publish a GitHub Release with the installers attached
  # (mirrors upstream release.yml, but fork-only so it works without secrets).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
